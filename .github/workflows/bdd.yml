name: BDD gate

on:
  pull_request:
  push:
    branches: [main]

env:
  AUTOSTART_APP: "0"  
  BASE_URL: http://127.0.0.1:8000

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Start app
        run: |
          uvicorn app.main:app --port 8000 --log-level warning &
          for i in $(seq 1 50); do curl -sf $BASE_URL/api/orders && break; sleep 0.2; done
      - run: pytest -m api -n auto --junitxml=reports/api.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-report, path: reports/api.xml }

  # --- Layer 2: browser gate, sharded. -------------------------------------
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Start app
        run: |
          uvicorn app.main:app --port 8000 --log-level warning &
          for i in $(seq 1 50); do curl -sf $BASE_URL/api/orders && break; sleep 0.2; done
      - name: Run UI scenarios
        run: |
          pytest -m ui -n auto \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure \
            --output=artifacts/pw-ui \
            --junitxml=reports/ui.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-report
          # Traces open at trace.playwright.dev — this is what turns "it failed
          # in CI" into a click-by-click replay you can hand to the dev team.
          path: |
            reports/
            artifacts/

  # --- Layer 3: flows across the seam. Few, slow, high value. --------------
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Start app
        run: |
          uvicorn app.main:app --port 8000 --log-level warning &
          for i in $(seq 1 50); do curl -sf $BASE_URL/api/orders && break; sleep 0.2; done
      - name: Run journey scenarios
        run: |
          pytest -m e2e \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure \
            --output=artifacts/pw-e2e \
            --junitxml=reports/e2e.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            reports/
            artifacts/

  # --- The gate itself: decides who owns the breakage. ---------------------
  triage:
    runs-on: ubuntu-latest
    needs: [api, ui, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install httpx
      - uses: actions/download-artifact@v4
        with: { path: downloaded }
      - name: Collect reports
        run: |
          mkdir -p reports artifacts
          find downloaded -name 'api.xml' -exec cp {} reports/ \;
          find downloaded -name 'ui.xml' -exec cp {} reports/ \;
          find downloaded -name 'e2e.xml' -exec cp {} reports/ \;
          find downloaded -name 'locator-drift.json' -exec cp {} artifacts/ \; || true
      - name: Changed files
        run: git diff --name-only ${{ github.event.pull_request.base.sha || 'HEAD~1' }} HEAD > changed.txt
      - name: Triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python ai/triage.py \
            --api-junit reports/api.xml \
            --ui-junit reports/ui.xml \
            --e2e-junit reports/e2e.xml \
            --drift artifacts/locator-drift.json \
            --diff changed.txt
      # Make ONLY this job the required status check in branch protection.
      # It is the one that knows the difference between "test needs updating"
      # and "send this back to the team that wrote it".
